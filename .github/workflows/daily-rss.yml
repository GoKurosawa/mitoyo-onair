name: Daily RSS update and publish

on:
  schedule:
    # 毎日、日本時間6:17ごろ
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      force_discovery:
        description: '月次・週次の期限を無視して再確認'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mitoyo-daily-update
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out site files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx --no-install playwright install --with-deps chromium

      - name: Check Cloudflare settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Cloudflare secrets are not configured."
            exit 1
          fi

      - name: Test ordering rules
        run: python -m unittest discover -v

      - name: Discover public podcast candidates and missing RSS
        continue-on-error: true
        env:
          FORCE_DISCOVERY: ${{ inputs.force_discovery == true && '1' || '0' }}
        run: |
          if [ "$FORCE_DISCOVERY" = "1" ]; then
            python discovery.py --force
          else
            python discovery.py
          fi

      - name: Discovery summary
        if: always()
        run: |
          if [ -f discovery_report.md ]; then
            cat discovery_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '探索レポート未生成。日次RSS更新は独立して実行します。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch RSS and update site
        run: python daily_update.py

      - name: Fetch verified Pody articles and update site
        run: python pody_update.py --output index.html

      - name: Pody verification summary
        if: always()
        run: |
          if [ -f pody_report.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('pody_report.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('### Pody verification report', file=summary)
              print('Displayed: ' + str(report.get('displayed', 0)), file=summary)
              for program in report.get('programs', []):
                  print('- Program {program_id}: {status}; verified={verified}; issues={issues}'.format(
                      program_id=program.get('program_id'), status=program.get('status'),
                      verified=program.get('verified', 0), issues=len(program.get('issues', []))), file=summary)
              if report.get('render_error'):
                  print('Render error: ' + str(report['render_error']), file=summary)
          PY
          fi

      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name mitoyo-onair --assets ./public --compatibility-date 2026-10-24

      - name: Save updated site and RSS cache
        run: |
          git add index.html rss_cache.json pody_cache.json pody_report.json
          for file in programs.json discovery_state.json discovery_candidates.json discovery_report.md; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Update podcast episodes and ordering"
            git push
          fi
